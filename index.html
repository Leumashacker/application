<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Girlfriend Application Form 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow paper-form column; section headers as filing tabs, answers as ruled lines and tick boxes, a red HR stamp at the end. */
:root{
  --bg:#e9ecf1; --paper:#fbfbf8; --ink:#1b2438; --muted:#5d6779; --rule:#aab2c0;
  --accent:#c2312d; --accent-ink:#ffffff; --field:#f0f2f6; --focus:#2d5bd6;
  --display:'Archivo','Arial Narrow',Arial,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141f; --paper:#171e2c; --ink:#e7ebf3; --muted:#9aa4b8; --rule:#3a4459;
  --accent:#ef6a5f; --accent-ink:#1a0d0c; --field:#1f2839; --focus:#7da0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141f; --paper:#171e2c; --ink:#e7ebf3; --muted:#9aa4b8; --rule:#3a4459;
  --accent:#ef6a5f; --accent-ink:#1a0d0c; --field:#1f2839; --focus:#7da0ff; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
.sheet{max-width:720px;margin:0 auto;background:var(--paper);border:1px solid var(--rule);padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:28px;min-width:0}
header h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6.5vw,44px);line-height:1.02;letter-spacing:-.01em;margin:0 0 14px;text-transform:uppercase;text-wrap:balance}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-family:var(--mono);font-size:12.5px;margin:0;color:var(--muted)}
.meta dt{text-transform:uppercase;letter-spacing:.06em}
.meta dd{margin:0;color:var(--ink)}
.warn{font-size:13px;color:var(--accent);font-weight:600;margin-top:10px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
section>h2{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0;padding:6px 10px;background:var(--ink);color:var(--paper);display:flex;gap:10px;align-items:baseline;text-wrap:balance}
section>h2 span{font-family:var(--mono);font-weight:500;font-size:12px;opacity:.75}
.note{font-size:13px;color:var(--muted);margin:-6px 0 0}
.q{display:flex;flex-direction:column;gap:7px;min-width:0;border:0;padding:0;margin:0}
.q>legend,.q>label.lab{font-weight:600;padding:0;font-size:14.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
input[type=text],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:0;border-bottom:1.5px solid var(--rule);border-radius:0;padding:8px 8px;min-width:0}
textarea{resize:vertical;min-height:64px;line-height:1.45}
input[type=text]:focus,textarea:focus,input[type=number]:focus{outline:2px solid var(--focus);outline-offset:0;border-bottom-color:var(--focus)}
.opts{display:flex;flex-wrap:wrap;gap:6px 18px}
.opt{display:inline-flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:14.5px;min-width:0}
.opt input{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;margin:2px 0 0;border:1.5px solid var(--ink);background:var(--field);display:grid;place-content:center;cursor:pointer}
.opt input::after{content:"";width:10px;height:10px;background:var(--accent);transform:scale(0);transition:transform .12s}
.opt input:checked::after{transform:scale(1)}
.opt input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.rate{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 18px}
.rate label{display:flex;flex-direction:column;gap:3px;font-size:13.5px;font-weight:600}
.rate input{font-family:var(--mono)}
.rate .out{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.rate input[type=range]{width:100%;accent-color:var(--accent);padding:0;background:none;border:0}
.sig{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:520px){.sig{grid-template-columns:1fr}}
.notice{font-size:13px;color:var(--muted);border-top:1px dashed var(--rule);padding-top:14px}
.notice b{color:var(--ink);font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
.hr{border:2px dashed var(--rule);padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;opacity:.9}
.hr h3{font-family:var(--display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0}
.hr .grid{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.hr .grid span{display:inline-flex;gap:6px;align-items:center}
.hr .grid i{width:12px;height:12px;border:1.5px solid var(--muted);display:inline-block}
.stamp{position:absolute;right:12px;top:10px;transform:rotate(-8deg);border:3px solid var(--accent);color:var(--accent);font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:4px 10px;font-size:15px;background:var(--paper)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button{font:inherit;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:12px 22px;border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);cursor:pointer;border-color:var(--accent)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.status{font-size:13.5px;min-height:1.4em}
.status.err{color:var(--accent);font-weight:600}
#done[hidden]{display:none}
#done{display:flex;flex-direction:column;gap:12px;background:var(--field);padding:16px;border-left:5px solid var(--accent)}
#done h3{margin:0;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em}
#done p{margin:0}
#summary{font-family:var(--mono);font-size:12px;min-height:120px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}</style></head><body>

<main class="sheet">
  <header>
    <h1>Girlfriend Application Form &ndash; 2026</h1>
    <dl class="meta">
      <dt>Position</dt><dd>My Girlfriend</dd>
      <dt>Department</dt><dd>My Heart &amp; Happiness</dd>
      <dt>Contract</dt><dd>Long-term, renewable indefinitely</dd>
      <dt>Application fee</dt><dd>KES 0.00</dd>
    </dl>
    <p class="warn">Wasting my time will result in immediate rejection.</p>
  </header>

  <form id="form" novalidate autocomplete="off"></form>
</main>

<script>
const S = [];
const sec = (title, note, qs) => S.push({title, note, qs});
const T = (id, label) => ({t:'text', id, label});
const A = (id, label, rows) => ({t:'area', id, label, rows: rows || 2});
const R = (id, label, opts, other) => ({t:'radio', id, label, opts, other});
const G = (id, label, items, max) => ({t:'rate', id, label, items, max: max || 10});

sec('Personal information', '', [
  {t:'row', qs:[T('full_name','Full name'), T('age','Age')]},
  {t:'row', qs:[T('from','Where are you from?'), T('occupation','Occupation')]},
  R('status','Relationship status',['Single','Complicated','"We\'re basically broken up"','Other'],'status_other'),
  R('children','Do you have children?',['No','Yes'],'children_count'),
  R('situationship','Do you currently have a boyfriend / husband / "situationship"?',['No','Yes','It\'s complicated'])
]);
sec('Relationship history', '', [
  T('last_len','How long was your last relationship?'),
  T('why_ended','Why did it end?'),
  R('over_ex','Are you completely over your ex?',['Yes','No','I still check their page sometimes']),
  R('ex_comm','Do you still communicate with your ex?',['No','Yes'],'ex_comm_explain'),
  A('prev_taught','What did your previous relationship teach you?')
]);
sec('Emotional intelligence', '', [
  A('angry','When you\'re angry with your partner, what do you normally do?'),
  A('hurt','If your boyfriend tells you that something you did hurt him, what would you do?'),
  R('disappear','Can you communicate when you\'re upset instead of disappearing?',['Absolutely','I need time, but I communicate','I disappear for 3 business days']),
  A('disagree','How do you handle disagreements?')
]);
sec('Communication test', '', [
  R('busy','Your boyfriend sends you a message and you\'re busy. What do you do?',['Ignore him until I\'m free','Tell him I\'m busy and respond when I can','Send a quick "I\'m busy, I\'ll text you later"','Depends on my mood']),
  R('freq','How often do you like communicating with your partner?',['All day','Throughout the day','Morning & evening','Whenever I remember']),
  R('calls','Are you comfortable with phone calls / video calls?',['Yes','No','Depends who\'s calling'])
]);
sec('Red flag disclosure', 'Please answer HONESTLY. Lying on this section will result in immediate termination of application.', [
  R('cheat','Do you cheat?',['No','Sometimes','I believe "it\'s not cheating if..."']),
  R('entertain','Do you entertain other men while in a relationship?',['No','Sometimes','I just like attention']),
  R('flirt','Do you flirt with other men?',['No','Yes','Only when I\'m bored']),
  R('anger_issues','Do you have anger issues?',['No','Sometimes','Yes, but I\'m working on it']),
  R('lie','Do you lie?',['Never','Sometimes','Everyone lies']),
  T('red_flag','What is your biggest red flag?')
]);
sec('Girlfriend duties', '', [
  G('ratings','Rate yourself from 1 to 10',['Communication','Loyalty','Affection','Romance','Patience','Emotional support','Consistency','Making your boyfriend laugh','Planning dates']),
  A('good_gf','What does being a good girlfriend mean to you?'),
  A('feel_loved','What would you do to make your boyfriend feel loved and appreciated?')
]);
sec('Financial & responsibility check', '', [
  R('income','Do you have a job / income?',['Yes','No','Currently looking']),
  R('pay_dates','How do you feel about paying for dates?',['I don\'t mind','We can take turns','50/50 always','My boyfriend can pay']),
  R('fin_resp','Are you financially responsible?',['Yes','Trying my best','My bank account needs prayer'])
]);
sec('Love & affection', '', [
  R('love_lang','What is your love language?',['Words of affirmation','Quality time','Physical touch','Acts of service','Gifts','All of the above']),
  R('affectionate','How affectionate are you?',['Very affectionate','Moderately affectionate','I\'m shy','Please don\'t touch me']),
  R('reassure_like','Do you like giving your partner reassurance?',['Yes','No','Only when necessary']),
  A('reassure','How would you reassure your boyfriend if he was feeling insecure?')
]);
sec('Jealousy & boundaries', '', [
  G('jealous','How jealous are you from 1 to 10?',['Jealousy level']),
  R('phone','Would you go through your boyfriend\'s phone?',['No','If I have a reason','Yes, I need to know everything']),
  R('female_friends','Do you believe your boyfriend should have female friends?',['Yes','No','Depends on the friendship']),
  A('boundaries','What boundaries do you expect in a relationship?')
]);
sec('Intentions', '', [
  A('why_apply','Why are you applying for this position?'),
  R('looking','What are you looking for?',['Serious relationship','Something casual','Friendship','Marriage eventually','I don\'t know yet','I just think he\'s cute']),
  A('two_three','Where do you see yourself in 2 to 3 years?'),
  A('commitment','What does commitment mean to you?'),
  R('willing','Are you willing to be loyal, honest, consistent and intentional?',['Yes','No','I need to think about it'])
]);
sec('Final interview', '', [
  A('fi1','1. Why should I choose you over the other applicants?'),
  A('fi2','2. What is one thing you can promise me as my girlfriend?'),
  A('fi3','3. What is something you would NEVER do to your boyfriend?'),
  A('fi4','4. What is your idea of a perfect date?'),
  A('fi5','5. If we had an argument, what would you do before going to sleep?'),
  A('fi6','6. If I\'m having a terrible day, how would you make it better?'),
  A('fi7','7. What are your intentions with me specifically?'),
  A('fi8','8. Tell me one thing about yourself that I should know before considering your application.')
]);
sec('Accountability test', '', [
  R('apology','Can you apologise without immediately following it with "but you..."?',['Yes','No','I already feel attacked'])
]);
sec('Initiative test', '', [
  R('plan_date','"Plan a date" means:',['Book something I know he\'ll love','Ask him 14 questions until he plans it himself','Say "I\'m easy, whatever you want"'])
]);

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function q(x){
  if(x.t==='row') return `<div class="row2">${x.qs.map(q).join('')}</div>`;
  if(x.t==='text') return `<div class="q"><label class="lab" for="${x.id}">${esc(x.label)}</label><input type="text" id="${x.id}" name="${x.id}"></div>`;
  if(x.t==='area') return `<div class="q"><label class="lab" for="${x.id}">${esc(x.label)}</label><textarea id="${x.id}" name="${x.id}" rows="${x.rows}"></textarea></div>`;
  if(x.t==='radio'){
    const o = x.opts.map((v,i)=>`<label class="opt"><input type="radio" name="${x.id}" id="${x.id}_${i}" value="${esc(v)}"><span>${esc(v)}</span></label>`).join('');
    const other = x.other ? `<input type="text" id="${x.other}" name="${x.other}" placeholder="Details (optional)" aria-label="Details for ${esc(x.label)}">` : '';
    return `<fieldset class="q"><legend>${esc(x.label)}</legend><div class="opts">${o}</div>${other}</fieldset>`;
  }
  if(x.t==='rate'){
    const items = x.items.map((l,i)=>{const id=`${x.id}_${i}`;return `<label for="${id}">${esc(l)}<input type="range" min="1" max="${x.max}" value="5" id="${id}" name="${id}" data-label="${esc(l)}"><span class="out" data-out="${id}">not rated</span></label>`}).join('');
    return `<div class="q"><div class="rate">${items}</div></div>`;
  }
  return '';
}
let n = 0;
const html = S.map(s=>{n++;
  return `<section><h2><span>${String(n).padStart(2,'0')}</span>${esc(s.title)}</h2>${s.note?`<p class="note">${esc(s.note)}</p>`:''}${s.qs.map(q).join('')}</section>`;
}).join('') + `
<section>
  <h2>The final question</h2>
  <div class="q"><label class="lab" for="final_q">If you become my girlfriend, what can I expect from you that will make me feel safe, loved, respected and appreciated?</label>
  <textarea id="final_q" name="final_q" rows="5"></textarea></div>
</section>
<div class="notice"><b>Important notice</b>Submitting this application does NOT guarantee employment. Successful candidates will undergo further screening, including consistency checks, communication assessments, loyalty testing and an extremely serious "Do you actually know how to treat a man?" evaluation.</div>
<section>
  <h2>Probation period</h2>
  <p class="note">Good morning texts alone do not constitute satisfactory performance. By signing below, you confirm that all information provided is truthful.</p>
  <div class="sig">
    <div class="q"><label class="lab" for="sig">Applicant signature (type your full name)</label><input type="text" id="sig" name="sig"></div>
    <div class="q"><label class="lab" for="sigdate">Date</label><input type="text" id="sigdate" name="sigdate" readonly></div>
  </div>
</section>
<div class="hr" id="hr" aria-label="Reserved for the reviewer">
  <h3>HR use only &ndash; do not fill in</h3>
  <div>Application reviewed by: Me</div>
  <div class="grid"><span><i></i>Approved</span><span><i></i>Shortlisted for interview</span><span><i></i>Under review</span><span><i></i>Rejected</span><span><i></i>Rejected immediately &ndash; red flags detected</span></div>
  <div class="grid"><span>Overall score: ____ / 100</span></div>
  <span class="stamp" id="stamp" hidden>Under review</span>
</div>
<div class="actions"><button type="submit" id="submit">Submit application</button><span class="status" id="status" role="status"></span></div>
<div id="done" hidden>
  <h3>Application received</h3>
  <p id="doneMsg">Your application is under review. Do not text him asking for an update.</p>
  <label class="lab" for="summary" style="font-weight:600">Copy of your answers</label>
  <textarea id="summary" readonly></textarea>
  <div class="actions"><button type="button" class="ghost" id="copy">Copy answers</button></div>
</div>`;

const form = document.getElementById('form');
form.innerHTML = html;
const today = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
document.getElementById('sigdate').value = today;

form.addEventListener('input', e=>{
  const t = e.target;
  if(t.type==='range'){
    t.dataset.touched='1';
    form.querySelector(`[data-out="${t.id}"]`).textContent = t.value + ' / ' + t.max;
  }
});

function collect(){
  const out = {};
  const lines = [];
  S.forEach((s,si)=>{
    lines.push(`\n== ${s.title.toUpperCase()} ==`);
    const walk = x=>{
      if(x.t==='row') return x.qs.forEach(walk);
      if(x.t==='rate'){
        x.items.forEach((l,i)=>{const el=document.getElementById(`${x.id}_${i}`);
          const v = el.dataset.touched ? el.value : '';
          out[`${x.id}_${i}`]=v; lines.push(`${l}: ${v||'-'}${v?'/'+x.max:''}`)});
        return;
      }
      let v='';
      if(x.t==='radio'){const c=form.querySelector(`input[name="${x.id}"]:checked`); v=c?c.value:'';
        if(x.other){const o=document.getElementById(x.other).value.trim(); out[x.other]=o; if(o) v+=` (${o})`;}
      } else v=document.getElementById(x.id).value.trim();
      out[x.id]=v; lines.push(`${x.label}\n  -> ${v||'-'}`);
    };
    s.qs.forEach(walk);
  });
  out.final_q = document.getElementById('final_q').value.trim();
  lines.push(`\n== THE FINAL QUESTION ==\n  -> ${out.final_q||'-'}`);
  out.sig = document.getElementById('sig').value.trim();
  out.sigdate = today;
  lines.push(`\nSigned: ${out.sig}   Date: ${today}`);
  return {out, text: `GIRLFRIEND APPLICATION 2026\nApplicant: ${out.full_name||'-'}\n`+lines.join('\n')};
}

const SB_URL='https://pregccfvqsxhmtnkjncc.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByZWdjY2Z2cXN4aG10bmtqbmNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTkxODMsImV4cCI6MjEwNDc5NTE4M30.i4y-PJ5HHTTghX6DyrHfHshspr_nsGMjCbcmi1-eJB0';
const statusEl = document.getElementById('status');
form.addEventListener('submit', async e=>{
  e.preventDefault();
  statusEl.className='status';
  const name = document.getElementById('full_name').value.trim();
  const sig = document.getElementById('sig').value.trim();
  if(!name){statusEl.textContent='Add your full name in Section 01 first.';statusEl.className='status err';document.getElementById('full_name').focus();return;}
  if(!sig){statusEl.textContent='Sign the form before submitting.';statusEl.className='status err';document.getElementById('sig').focus();return;}
  const btn=document.getElementById('submit'); btn.disabled=true; statusEl.textContent='Submitting...';
  const {out,text}=collect();
  let saved=false;
  try{
    const r = await fetch(SB_URL+'/rest/v1/girlfriend_applications',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
      body:JSON.stringify({applicant_name:name, answers:{...out, submittedAt:new Date().toISOString()}, summary:text})
    });
    saved = r.ok;
  }catch(err){ saved=false; }
  document.getElementById('summary').value = text;
  document.getElementById('doneMsg').textContent = saved
    ? 'Your application is filed and under review. Do not text him asking for an update.'
    : 'Your answers could not be filed from this view. Copy them below and send them to him directly.';
  document.getElementById('stamp').hidden=false;
  document.getElementById('done').hidden=false;
  statusEl.textContent = saved ? 'Submitted.' : 'Not filed. Copy your answers below.';
  if(!saved) statusEl.className='status err';
  btn.disabled=false;
  document.getElementById('done').scrollIntoView({behavior:'smooth',block:'center'});
});
document.getElementById('copy').addEventListener('click', async ()=>{
  const ta=document.getElementById('summary');
  try{ await navigator.clipboard.writeText(ta.value); statusEl.textContent='Copied.'; statusEl.className='status'; }
  catch(_){ ta.focus(); ta.select(); statusEl.textContent='Select and copy the text above.'; }
});
</script>
</body></html>
